name: בניית נספחים ד' ו-ה'

# חד־פעמי ברובו. מריצים כשעולה עדכון לפמ"ת המלא ב-Release.
# תלוי בשכבת רט"ג — הרצה אחריה, לא לפניה.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: התקנת תלויות
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: חילוץ נספחים ד' ו-ה'
        run: python scripts/build_annexes_de.py
      - name: חילוץ נקודות דיווח ושדות תעופה
        run: python scripts/build_points.py
      - name: קומיט אם השתנה
        run: |
          if git diff --quiet -- data/aip-obstacles.geojson data/ratag-reserves.geojson data/aip-points.json; then
            echo "אין שינוי."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aip-obstacles.geojson data/ratag-reserves.geojson data/aip-points.json data/aip-points.json
          git commit -m "עדכון נספחים ד' ו-ה' — $(date -u '+%Y-%m-%d')"
          git push
