name: אבחון מקורות

# כלי חקירה. מריצים ידנית כשמשיכת הנוטאמים חוזרת ריקה, כדי לראות מה
# כל מקור באמת מחזיר. לא כותב שום דבר ל-repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: התקנת תלויות
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: אבחון
        run: python scripts/probe_sources.py
