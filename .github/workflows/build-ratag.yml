name: בניית שכבת רט"ג

# עבודה חד־פעמית ברובה, כמו שכבת הפמ"ת. מריצים כשרט"ג מפרסמים עדכון
# לשכבה, ואז מעלים ארכיון חדש ל-Release ומריצים את זה.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: התקנת תלויות
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: המרה
        run: python scripts/build_ratag_geojson.py
      - name: קומיט אם השתנה
        run: |
          if git diff --quiet -- data/ratag-reserves.geojson; then
            echo "אין שינוי בשכבה."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratag-reserves.geojson
          git commit -m "עדכון שכבת שמורות הטבע והגנים — $(date -u '+%Y-%m-%d')"
          git push
