name: בדיקת האתר החי

# פותח את האתר המפורסם בדפדפן אמיתי ובודק שהוא עובד — לא רק שהוא
# נטען. רץ ידנית, וגם אחת ליום כדי לתפוס שבר שנוצר ממשיכה שעתית
# ולא משינוי קוד.
#
# לא כותב דבר ל-repo.

on:
  workflow_dispatch:
    inputs:
      url:
        description: כתובת לבדיקה
        default: https://nadaval56.github.io/airspace/
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: התקנת תלויות
        run: |
          pip install --disable-pip-version-check playwright
          playwright install --with-deps chromium
      - name: בדיקה
        run: python scripts/check_live.py "${{ inputs.url || 'https://nadaval56.github.io/airspace/' }}"
