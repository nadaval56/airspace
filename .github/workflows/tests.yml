name: בדיקות

on:
  push:
    paths: ['scripts/**', 'requirements.txt', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: בדיקות פרסור
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: תקינות קבצי הנתונים
        run: |
          python -c "import json;json.load(open('data/notams.json'))"
          python -c "import json;json.load(open('data/aip-permanent.geojson'))"
          python -c "import json;json.load(open('data/weather.json'))"
