name: בדיקות

on:
  push:
    # assets/learn.js נמצא כאן מפני ש-test_learn_tables משווה את
    # טבלאות הפענוח שבו למודול הפייתון. שינוי בו בלבד חייב להריץ
    # את הבדיקות, אחרת הסטייה שהן שומרות מפניה תעבור בשקט.
    paths: ['scripts/**', 'assets/learn.js', 'requirements.txt', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # עד עכשיו כל הבדיקות היו על ספריית התקן בלבד, ולכן לא היה כאן
      # שלב התקנה. בדיקות ההמרה הגיאוגרפית זקוקות ל-pyshp ול-pyproj:
      # בלעדיהן הן היו מדולגות, ובדיקה שלא רצה אינה שומרת על כלום.
      - name: התקנת תלויות
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: בדיקות פרסור
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: תקינות קבצי הנתונים
        run: |
          python -c "import json;json.load(open('data/notams.json'))"
          python -c "import json;json.load(open('data/aip-permanent.geojson'))"
          python -c "import json;json.load(open('data/weather.json'))"
