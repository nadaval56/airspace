name: משיכת נוטאמים ומזג אוויר

on:
  schedule:
    # כל שעה. שימו לב: ב-repo ציבורי חינמי GitHub משבית cron אוטומטית
    # אחרי 60 יום ללא פעילות ב-repo. ראו README.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-notams
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # רשת אמורה לזרום או להיכשל, לא לזחול. ריצה אחת נתקעה 12 דקות כי
    # השרת האט עד שה-timeout של השקע לא נורה אף פעם. הגבול הזה הוא
    # רשת ביטחון: עדיף ריצה שנקטעת מאשר runner תפוס.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת תלויות
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: בדיקות פרסור
        # פרסור שבור גרוע מנתונים ישנים — נעצרים לפני שנוגעים בקובץ.
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: משיכה ופרסור
        # מקור שאין לו אישורים מדלג על עצמו בשקט ולא נחשב ככשל.
        # הגדרת הסודות: Settings → Secrets and variables → Actions.
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          AUTOROUTER_CLIENT_ID: ${{ secrets.AUTOROUTER_CLIENT_ID }}
          AUTOROUTER_CLIENT_SECRET: ${{ secrets.AUTOROUTER_CLIENT_SECRET }}
        run: python scripts/fetch_notams.py

      - name: משיכת מזג אוויר
        # אותו מקור, msgType=Weather. כשל כאן לא מפיל את הנוטאמים.
        run: python scripts/fetch_weather.py || echo "משיכת מזג האוויר נכשלה"

      - name: קומיט אם השתנה
        run: |
          if git diff --quiet -- data/notams.json data/weather.json data/notam-details.json; then
            echo "אין שינוי בנתונים."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notams.json data/weather.json data/notam-details.json
          git commit -m "עדכון נוטאמים ומזג אוויר אוטומטי — $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4; do
            git push && break
            echo "דחיפה נכשלה, ניסיון $attempt"
            sleep $((2 ** attempt))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
