name: משיכת נוטאמים

on:
  schedule:
    # כל שעה. שימו לב: ב-repo ציבורי חינמי GitHub משבית cron אוטומטית
    # אחרי 60 יום ללא פעילות ב-repo. ראו README.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-notams
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת תלויות
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: בדיקות פרסור
        # פרסור שבור גרוע מנתונים ישנים — נעצרים לפני שנוגעים בקובץ.
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: משיכה ופרסור
        run: python scripts/fetch_notams.py

      - name: קומיט אם השתנה
        run: |
          if git diff --quiet -- data/notams.json; then
            echo "אין שינוי בנתונים."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notams.json
          git commit -m "עדכון נוטאמים אוטומטי — $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4; do
            git push && break
            echo "דחיפה נכשלה, ניסיון $attempt"
            sleep $((2 ** attempt))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
